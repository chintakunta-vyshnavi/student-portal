<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}StudentPortal{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body>

    <header class="navbar">
        <div class="container nav-content">

            <a href="/" class="logo">StudentPortal</a>

            <nav class="nav-links">
                <a href="/">Home</a>

                {% if request.session.get("user_id") %}
                    <a href="/dashboard">Dashboard</a>
                    <a href="/logout" class="nav-button">Logout</a>
                {% else %}
                    <a href="/register">Register</a>
                    <a href="/login" class="nav-button">Login</a>
                {% endif %}
            </nav>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 StudentPortal. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
